<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --bg: #0b0f19;
      --card-bg: rgba(23, 27, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(15, 20, 35, 0.7);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --error: #f43f5e;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(14, 165, 233, 0.12) 0px, transparent 60%);
      color: var(--text-main);
      padding: 1.5rem;
    }

    /* Background decorative glow blobs */
    .glow-blob {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 {
      top: 15%;
      left: 20%;
      background: rgba(99, 102, 241, 0.2);
    }
    .blob-2 {
      bottom: 15%;
      right: 20%;
      background: rgba(236, 72, 153, 0.15);
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.1);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 10px 20px var(--primary-glow);
    }

    .logo-badge svg {
      width: 28px;
      height: 28px;
      color: #fff;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.35rem;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.925rem;
    }

    /* Tabs for Sign in / Sign up */
    .tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 0.65rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-wrapper input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 0.75rem 2.75rem 0.75rem 2.6rem;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input::placeholder {
      color: #64748b;
    }

    .input-wrapper input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .input-wrapper input:focus + .icon,
    .input-wrapper:focus-within .icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s ease;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-top: -0.25rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .remember-me input {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      text-decoration: underline;
      opacity: 0.9;
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--primary), #818cf8);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.85rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--primary-glow);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, var(--primary-hover), #6366f1);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0 1.25rem;
      color: #64748b;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .divider span {
      padding: 0 0.85rem;
    }

    .social-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Notification / Toast */
    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem 1.25rem;
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transform: translateY(-20px);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.error {
      border-left: 4px solid var(--error);
    }

    /* Hidden helper class for sign up fields */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="container">
    <div class="header">
      <div class="logo-badge">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h1 id="form-title">Welcome Back</h1>
      <p id="form-subtitle">Enter your credentials to access your account</p>
    </div>

    <!-- Mode Selector Tabs -->
    <div class="tabs">
      <button class="tab-btn active" id="tab-login" onclick="switchMode('login')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchMode('signup')">Sign Up</button>
    </div>

    <form id="auth-form" onsubmit="handleSubmit(event)">
      <!-- Name field (Only shown for Sign Up) -->
      <div class="form-group hidden" id="group-name">
        <label for="name">Full Name</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <input type="text" id="name" placeholder="John Doe" autocomplete="name">
        </div>
      </div>

      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
          </svg>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', 'eye-icon')">
            <svg id="eye-icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password Field (Only shown for Sign Up) -->
      <div class="form-group hidden" id="group-confirm-password">
        <label for="confirm-password">Confirm Password</label>
        <div class="input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
          </svg>
          <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password">
        </div>
      </div>

      <!-- Options (Remember me & Forgot Password) -->
      <div class="options" id="login-options">
        <label class="remember-me">
          <input type="checkbox" id="remember">
          <span>Remember me</span>
        </label>
        <a href="#forgot" class="forgot-link" onclick="handleForgotPassword(event)">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">
        <span id="btn-text">Sign In</span>
      </button>

      <div class="divider">
        <span>Or continue with</span>
      </div>

      <!-- Social Logins -->
      <div class="social-buttons">
        <button type="button" class="social-btn" title="Sign in with Google" onclick="handleSocialAuth('Google')">
          <!-- Google SVG -->
          <svg viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23.5c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.9C3.7 20.6 7.5 23.5 12 23.5z"/>
          </svg>
        </button>

        <button type="button" class="social-btn" title="Sign in with GitHub" onclick="handleSocialAuth('GitHub')">
          <!-- GitHub SVG -->
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
          </svg>
        </button>

        <button type="button" class="social-btn" title="Sign in with Apple" onclick="handleSocialAuth('Apple')">
          <!-- Apple SVG -->
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.61-.75 1.04-1.8 1.01-2.87-.96.04-2.1.65-2.77 1.42-.58.67-1.09 1.74-1 2.8.02 0 .04 0 .07 0 1.01 0 2.08-.6 2.69-1.35z"></path>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <!-- Toast for User Feedback -->
  <div class="toast" id="toast">
    <span id="toast-message">Message text</span>
  </div>

  <script>
    let currentMode = 'login';

    function switchMode(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const formTitle = document.getElementById('form-title');
      const formSubtitle = document.getElementById('form-subtitle');
      const groupName = document.getElementById('group-name');
      const groupConfirm = document.getElementById('group-confirm-password');
      const loginOptions = document.getElementById('login-options');
      const btnText = document.getElementById('btn-text');
      const nameInput = document.getElementById('name');
      const confirmInput = document.getElementById('confirm-password');

      if (mode === 'signup') {
        tabLogin.classList.remove('active');
        tabSignup.classList.add('active');
        formTitle.textContent = 'Create Account';
        formSubtitle.textContent = 'Sign up to get started with your new account';
        groupName.classList.remove('hidden');
        groupConfirm.classList.remove('hidden');
        loginOptions.classList.add('hidden');
        btnText.textContent = 'Create Account';
        nameInput.required = true;
        confirmInput.required = true;
      } else {
        tabSignup.classList.remove('active');
        tabLogin.classList.add('active');
        formTitle.textContent = 'Welcome Back';
        formSubtitle.textContent = 'Enter your credentials to access your account';
        groupName.classList.add('hidden');
        groupConfirm.classList.add('hidden');
        loginOptions.classList.remove('hidden');
        btnText.textContent = 'Sign In';
        nameInput.required = false;
        confirmInput.required = false;
      }
    }

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);

      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>
        `;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
        `;
      }
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');

      toastMessage.textContent = message;
      toast.className = `toast ${type} show`;

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }

    function handleSubmit(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (currentMode === 'signup') {
        const name = document.getElementById('name').value.trim();
        const confirmPassword = document.getElementById('confirm-password').value;

        if (password.length < 6) {
          showToast('Password should be at least 6 characters.', 'error');
          return;
        }

        if (password !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        showToast(`Account created successfully for ${name}!`, 'success');
      } else {
        showToast(`Logged in successfully as ${email}!`, 'success');
      }
    }

    function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (email) {
        showToast(`Password reset link sent to ${email}`, 'success');
      } else {
        showToast('Please enter your email address first.', 'error');
      }
    }

    function handleSocialAuth(provider) {
      showToast(`Redirecting to ${provider} authentication...`, 'success');
    }
  </script>
</body>
</html>
